<!doctype html>
<meta charset="utf-8">
<title>Project picker smoke test</title>
<nav id="sidebar">
  <div id="chat-row" data-sidebar-item="true" draggable="true"><a href="/c/test-chat">Test chat</a></div>
  <div><span>项目</span></div>
  <div id="project-row" data-sidebar-item="true"><a href="/g/g-p-test-project">Test project</a></div>
</nav>
<div id="result">PENDING</div>
<script>
  const params = new URLSearchParams(location.search);
  const empty = params.has('empty');
  if (params.has('native') || params.has('mixed')) {
    const rows = [document.getElementById('chat-row')];
    if (params.has('mixed')) {
      const second = rows[0].cloneNode(true);
      second.id = 'chat-row-2';
      second.querySelector('a').href = '/c/test-chat-two';
      second.querySelector('a').textContent = 'Test chat two';
      rows[0].after(second);
      rows.push(second);
    }
    rows.forEach((chatRow, index) => {
      chatRow.removeAttribute('draggable');
      const menuButton = document.createElement('button');
      menuButton.type = 'button';
      menuButton.setAttribute('aria-label', '更多选项');
      menuButton.textContent = '•••';
      menuButton.addEventListener('click', () => {
        document.querySelectorAll('[role="menu"]').forEach((menu) => menu.remove());
        const menu = document.createElement('div');
        menu.setAttribute('role', 'menu');
        const move = document.createElement('button');
        move.type = 'button';
        move.setAttribute('role', 'menuitem');
        move.textContent = params.has('mixed') && index === 0 ? '归档' : '移至项目';
        move.addEventListener('click', () => {
          menu.replaceChildren();
          const destination = document.createElement('button');
          destination.type = 'button';
          destination.setAttribute('role', 'menuitem');
          destination.textContent = 'Test project';
          destination.addEventListener('click', () => chatRow.remove());
          menu.appendChild(destination);
        });
        menu.appendChild(move);
        document.body.appendChild(menu);
      });
      chatRow.appendChild(menuButton);
    });
  }
  const projectRow = document.getElementById('project-row');
  if (empty) projectRow.remove();
  else {
    if (new URLSearchParams(location.search).has('folder')) {
      projectRow.removeAttribute('data-sidebar-item');
      projectRow.className = 'group/folder-row';
      projectRow.innerHTML = '<div class="flex min-w-0 items-center gap-2 rounded-md py-1"><span class="viewport"><span data-marquee-content="true">Test project</span></span></div>';
    }
    if (new URLSearchParams(location.search).has('menu')) {
      projectRow.removeAttribute('data-sidebar-item');
      projectRow.innerHTML = '<div><span data-marquee-content="true">Test project</span></div><div class="group-hover/folder-row:opacity-100"></div>';
    }
    if (new URLSearchParams(location.search).has('button')) {
      projectRow.innerHTML = '<button type="button"><svg width="16" height="16"><path d="M1 1h14v14H1z"></path></svg> Test project</button>';
    }
    projectRow.addEventListener('dragover', (event) => event.preventDefault());
    projectRow.addEventListener('drop', (event) => {
      event.preventDefault();
      document.getElementById('chat-row')?.remove();
    });
  }
</script>
<link rel="stylesheet" href="../styles.css">
<script src="../content.js"></script>
<script>
  setTimeout(() => {
    if (new URLSearchParams(location.search).has('mixed')) {
      document.querySelectorAll('.gbm-checkbox').forEach((box) => box.click());
    } else document.querySelector('.gbm-checkbox')?.click();
    document.querySelector('[data-gbm-action="move"]')?.click();
    if (new URLSearchParams(location.search).has('preview')) return;
    setTimeout(() => {
      const dialog = document.querySelector('.gbm-project-picker');
      const result = document.getElementById('result');
      if (!dialog) { result.textContent = 'FAIL: no dialog'; return; }
      if (empty) {
        dialog.querySelector('.gbm-project-picker__cancel')?.click();
        setTimeout(() => {
          result.textContent = document.querySelector('.gbm-status')?.textContent.includes('未识别到左侧项目')
            ? 'GBM_TEST_PASS_EMPTY' : 'FAIL: wrong empty status';
        }, 50);
      } else {
        dialog.querySelector('.gbm-project-picker__list button')?.click();
        setTimeout(() => {
          const mixed = new URLSearchParams(location.search).has('mixed');
          const moved = mixed ? document.getElementById('chat-row') && !document.getElementById('chat-row-2')
            : !document.getElementById('chat-row');
          const status = mixed ? '移动成功 1/2' : '移动成功 1/1';
          result.textContent = moved && document.querySelector('.gbm-status')?.textContent.includes(status)
            ? 'GBM_TEST_PASS_MOVE' : 'FAIL: move not confirmed';
        }, new URLSearchParams(location.search).has('mixed') ? 2800 : 500);
      }
    }, 100);
  }, 200);
</script>
