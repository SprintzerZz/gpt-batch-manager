<div id="result">PENDING</div>
<link rel="stylesheet" href="../styles.css">
<script src="../content.js"></script>
<script>
  setTimeout(() => {
    const links = [...document.querySelectorAll('#sidebar a[href*="/c/"]')];
    const tags = links.map((link) => link.querySelector('.gbm-project-tag'));
    const initial = tags[0]?.textContent === 'Alpha' && tags[1]?.textContent === 'Beta' &&
      tags[2]?.textContent === 'Gamma' && tags[3]?.textContent === 'Delta' &&
      tags[4]?.textContent === 'Epsilon' && tags[5]?.textContent === 'Zeta' &&
      tags[6]?.textContent === 'Eta' && tags[7]?.textContent === 'Alpha' &&
      tags[8]?.textContent === 'Epsilon' && tags[9]?.textContent === 'Beta' && !tags[10] &&
      tags[0].style.backgroundColor === tags[7].style.backgroundColor &&
      tags[0].style.backgroundColor !== tags[1].style.backgroundColor &&
      !['rgb(0, 0, 0)', 'rgb(255, 255, 255)'].includes(tags[0].style.backgroundColor) &&
      links[0].firstElementChild.classList.contains('gbm-checkbox') &&
      links[0].children[1] === tags[0];
    links[0].href = '/c/one';
    setTimeout(() => {
      const updated = links[0].querySelector('.gbm-project-tag')?.textContent === 'Alpha';
      document.getElementById('sidebar').appendChild(links[0].parentElement);
      links[4].parentElement.remove();
      setTimeout(() => {
        const preserved = links[0].querySelector('.gbm-project-tag')?.textContent === 'Alpha';
        const cached = links[8].querySelector('.gbm-project-tag')?.textContent === 'Epsilon';
        document.getElementById('result').textContent = initial && updated && preserved && cached
          ? 'GBM_TEST_PASS_TAGS' : 'FAIL: project tags';
      }, 600);
    }, 600);
  }, 600);
</script>
